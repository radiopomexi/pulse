[project]
name = "pulse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<6",
    "Pillow>=10.0",
    "psycopg2-binary>=2.9",
    "dj-database-url>=2.1",
]

[tool.vercel.scripts]
build = "python manage.py migrate --noinput && python manage.py seed_exercises && python manage.py ensure_admin"
